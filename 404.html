<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>사내 접속 확인 · LLM 강의</title>
  <base href="/llm_lecture1/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; font-family: system-ui, sans-serif; }
    main { padding: 32px; text-align: center; }
    h1 { font-size: clamp(22px, 4vw, 30px); }
    p { color: #516078; line-height: 1.7; }
    button { padding: 10px 20px; border: 0; border-radius: 8px; background: #2455d6; color: white; font: inherit; cursor: pointer; }
  </style>
  <script src="web-access-gate.js" defer></script>
</head>
<body>
  <main>
    <h1>LLM 강의</h1>
    <p id="access-message" role="status" aria-live="polite">접속 확인 중입니다…</p>
    <button id="access-retry" hidden onclick="location.reload()">다시 확인</button>
    <noscript><p>강의를 보려면 JavaScript를 켜고 사내에서 접속해 주세요.</p></noscript>
  </main>
</body>
</html>
